<div class="country-card">
	<div class="center">
		<div>{{ title }}</div>
	</div>

	<div class="split">
		<div>
			<p>Number of entries</p>
			<p>{{ totalEntries }}</p>
		</div>
		<div>
			<p>Total Number of medals</p>
			<p>{{ totalMedals }}</p>
		</div>
		<div>
			<p>Total Number of athletes</p>
			<p>{{ totalAthletes }}</p>
		</div>
	</div>
</div>
